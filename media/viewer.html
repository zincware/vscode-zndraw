<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZnDraw</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1e1e1e;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .loading {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #888;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top: 3px solid #888;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <iframe src="{{url}}" id="zndraw-frame"></iframe>
    <script>
        const iframe = document.getElementById('zndraw-frame');
        let retryCount = 0;
        const maxRetries = 30;

        iframe.onerror = () => {
            if (retryCount < maxRetries) {
                retryCount++;
                document.body.innerHTML = '<div class="loading"><div class="spinner"></div><div>Connecting to ZnDraw... (attempt ' + retryCount + ')</div></div>';
                setTimeout(() => location.reload(), 2000);
            }
        };
    </script>
</body>
</html>
